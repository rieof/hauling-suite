<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hauling Suite · Star Citizen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
:root{
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --c-text-1:#e8ecf3;--c-text-2:#aab3c2;--c-text-3:#6b7484;
  --c-bg-1:#14171c;--c-bg-2:#1d222a;--c-bg-3:#242a33;
  --c-border-1:#3a414d;--c-border-2:#2a313b;--c-border-3:#1e242c;
  --c-info-bg:#042C53;--c-info-text:#B5D4F4;
  --c-ok-bg:#04342C;--c-ok-text:#9FE1CB;
  --c-warn-bg:#3D2800;--c-warn-text:#FAC775;
  --c-err-bg:#3D0D0D;--c-err-text:#FCA5A5;
  --c-blue:#378ADD;--c-green:#1D9E75;--c-red:#E84040;--c-orange:#F5A623;
  --r-sm:6px;--r-md:9px;--r-lg:13px;
  --c-faction:#378ADD;
}
@media(prefers-color-scheme:light){
  :root{
    --c-text-1:#1a1d23;--c-text-2:#4a5160;--c-text-3:#8a92a3;
    --c-bg-1:#f5f7fa;--c-bg-2:#ebeef3;--c-bg-3:#dde2ea;
    --c-border-1:#c5ccd6;--c-border-2:#dde2e9;--c-border-3:#e8ecf1;
    --c-info-bg:#ddeeff;--c-info-text:#0C447C;
    --c-ok-bg:#d4f0e6;--c-ok-text:#085041;
    --c-warn-bg:#fff3d4;--c-warn-text:#7a4900;
    --c-err-bg:#ffe5e5;--c-err-text:#9b1c1c;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);color:var(--c-text-1);min-height:100vh;background:radial-gradient(1400px 700px at 85% -5%, rgba(55,138,221,.12),transparent 60%),radial-gradient(800px 600px at -5% 110%, rgba(29,158,117,.09),transparent 55%),var(--c-bg-1);background-attachment:fixed;}
select,input[type=number]{width:100%;font-family:var(--font-mono);font-size:12px;padding:6px 8px;border-radius:var(--r-sm);border:1px solid var(--c-border-2);background:var(--c-bg-1);color:var(--c-text-1);transition:border-color .15s;}
select:focus,input:focus{outline:none;border-color:var(--c-faction);}
.page-wrap{max-width:960px;margin:0 auto;padding:0 18px 72px;}
.page-foot{text-align:center;font-size:11px;color:var(--c-text-3);font-family:var(--font-mono);padding:28px 0 0;line-height:1.7;}
.app{padding:1.5rem 0;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;gap:8px;}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(135deg,var(--c-text-1) 60%,var(--c-text-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.disclaimer{font-size:10px;color:var(--c-text-3);background:var(--c-bg-2);border-radius:var(--r-md);padding:8px 12px;margin-bottom:1rem;line-height:1.5;border:1px solid var(--c-border-3);}
.ship-bar{background:var(--c-bg-2);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;border:1px solid var(--c-border-2);}
.sg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;}
.sg label{font-size:10px;color:var(--c-text-3);font-family:var(--font-mono);text-transform:uppercase;}
.cap-display{text-align:center;background:var(--c-bg-1);border-radius:var(--r-md);padding:7px;border:1px solid var(--c-border-2);position:relative;overflow:hidden;cursor:pointer;}
.cap-display .cv{font-size:20px;font-weight:600;font-family:var(--font-mono);color:var(--c-faction);}
.cap-display .cl{font-size:9px;color:var(--c-text-3);}
.rank-bar{background:var(--c-bg-2);border:1px solid var(--c-border-2);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:10px;border-left:3px solid var(--c-faction);}
.rank-bar .rb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rank-bar label{font-size:10px;color:var(--c-text-3);font-family:var(--font-mono);text-transform:uppercase;}
.rank-info{font-size:11px;color:var(--c-text-3);margin-top:8px;font-family:var(--font-mono);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.panel{background:var(--c-bg-2);border-radius:var(--r-lg);padding:12px 14px;border:1px solid var(--c-border-3);}
.ptitle{font-size:10px;font-family:var(--font-mono);color:var(--c-text-3);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.mode-seg{display:flex;gap:6px;margin-bottom:8px;}
.mode-seg button{flex:1;font-size:11px;padding:8px 6px;border:1px solid var(--c-border-2);background:var(--c-bg-1);border-radius:var(--r-md);cursor:pointer;color:var(--c-text-3);font-family:var(--font-mono);transition:all .15s;}
.mode-seg button.on{background:color-mix(in srgb,var(--c-faction) 12%,var(--c-bg-1));color:var(--c-faction);border-color:var(--c-faction);font-weight:600;}
.mode-seg button b{display:block;font-size:14px;}
.pct-slider-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.pct-slider-row input[type=range]{flex:1;cursor:pointer;}
.pct-slider-row .pct-val{font-size:13px;font-weight:600;font-family:var(--font-mono);min-width:36px;text-align:right;color:var(--c-faction);}
.dest-toggle{display:flex;align-items:center;gap:8px;background:var(--c-bg-2);border-radius:var(--r-md);padding:9px 14px;margin-bottom:10px;border:1px solid var(--c-border-3);}
.dest-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.dest-fields.hidden{display:none;}
.smart-panel{background:var(--c-bg-2);border:1px solid var(--c-border-2);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:10px;border-top:2px solid var(--c-faction);}
.smart-input-row{display:flex;gap:6px;align-items:center;}
.smart-input-row input[type=text]{flex:1;font-family:var(--font-mono);font-size:12px;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--c-border-2);background:var(--c-bg-1);color:var(--c-text-1);}
.smart-btn{padding:7px 12px;border-radius:var(--r-sm);border:none;background:var(--c-faction);color:#fff;cursor:pointer;font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;gap:5px;}
.smart-status{font-size:11px;color:var(--c-text-3);font-family:var(--font-mono);margin-top:6px;min-height:16px;display:flex;align-items:center;gap:6px;}
.smart-status.ok{color:var(--c-green);}
.smart-status.err{color:var(--c-red);}
#session-bar{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--c-faction) 8%,var(--c-bg-2));border:1px solid color-mix(in srgb,var(--c-faction) 25%,transparent);border-radius:var(--r-md);padding:7px 14px;font-size:11px;font-family:var(--font-mono);margin-bottom:8px;}
.add-missionssion-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.add-missionssion-row button{font-size:12px;padding:7px 13px;border-radius:var(--r-md);cursor:pointer;border:1px solid var(--c-border-1);background:var(--c-bg-2);color:var(--c-text-2);font-family:var(--font-mono);transition:all .15s;}
.add-missionssion-row button.accent{border-color:var(--c-faction);color:var(--c-faction);background:color-mix(in srgb,var(--c-faction) 10%,transparent);}
.add-missionssion-row button.accent:hover{background:var(--c-faction);color:#fff;}
.cm-card{background:var(--c-bg-2);border:1px solid var(--c-border-3);border-radius:var(--r-md);padding:0;overflow:hidden;border-left:3px solid var(--c-faction);margin-bottom:8px;}
.cm-card-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:0.5px solid var(--c-border-3);background:color-mix(in srgb,var(--c-faction) 4%,var(--c-bg-2));}
.cm-badge{background:var(--c-faction);color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;font-family:var(--font-mono);}
.cm-scu-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--c-bg-3);color:var(--c-text-2);border:0.5px solid var(--c-border-2);font-family:var(--font-mono);}
.cm-mat-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c-blue) 12%,transparent);color:var(--c-blue);border:0.5px solid color-mix(in srgb,var(--c-blue) 25%,transparent);}
.cm-timeline{padding:10px 12px;display:flex;flex-direction:column;gap:0;}
.cm-tl-item{display:flex;gap:10px;align-items:stretch;}
.cm-tl-dot-col{display:flex;flex-direction:column;align-items:center;width:20px;flex-shrink:0;}
.cm-tl-dot{width:12px;height:12px;border-radius:50%;margin-top:7px;}
.cm-tl-dot.pickup{background:var(--c-blue);}
.cm-tl-dot.delivery{background:#C2410C;}
.cm-tl-dot.delivery.nearest{background:var(--c-green);}
.cm-tl-line{width:2px;background:var(--c-border-2);flex:1;min-height:8px;margin:2px auto;}
.cm-tl-content{flex:1;padding-bottom:8px;}
.tabs{display:flex;margin:1rem 0;border-bottom:1px solid var(--c-border-2);flex-wrap:wrap;}
.tab{font-size:12px;padding:8px 16px;border:none;background:transparent;cursor:pointer;color:var(--c-text-3);font-family:var(--font-mono);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.on{color:var(--c-faction);border-bottom-color:var(--c-faction);font-weight:600;}
.calc-btn{width:100%;font-size:14px;font-weight:600;padding:13px;border:none;border-radius:var(--r-md);cursor:pointer;background:var(--c-faction);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem;}
.stat{background:var(--c-bg-2);border-radius:var(--r-md);padding:8px 12px;border:1px solid var(--c-border-3);}
.stat .sv{font-size:17px;font-weight:600;font-family:var(--font-mono);color:var(--c-text-1);}
.stat .sl{font-size:10px;color:var(--c-text-3);}
.step-wrap{display:flex;gap:0;align-items:stretch;}
.step-left{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:10px;}
.step-card{flex:1;border-radius:12px;border:0.5px solid var(--c-border-1);margin:5px 0;overflow:hidden;cursor:pointer;}
.step-card.done{opacity:0.4;}
.sc-head{padding:10px 14px;display:flex;align-items:center;gap:10px;}
.sc-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.sc-text{flex:1;}
.sc-name{font-size:14px;font-weight:500;}
.sc-sub{font-size:11px;color:var(--c-text-3);}
.loc-wrap{position:relative;flex:1;}
.loc-input{width:100%;font-family:var(--font-mono);font-size:11px;padding:4px 24px 4px 7px;height:27px;border:1px solid var(--c-border-2);border-radius:var(--r-sm);background:var(--c-bg-1);color:var(--c-text-1);}
.loc-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:999;background:var(--c-bg-2);border:1px solid var(--c-border-1);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(0,0,0,.35);max-height:220px;overflow-y:auto;display:none;}
.loc-dropdown.open{display:block;}
.loc-opt{padding:6px 10px;font-size:11px;font-family:var(--font-mono);cursor:pointer;}
.loc-opt:hover{background:color-mix(in srgb,var(--c-faction) 12%,var(--c-bg-2));}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{100%{transform:rotate(360deg);}}
@media(max-width:580px){.ship-bar{flex-direction:column;align-items:stretch;} .row2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page-wrap">
<div class="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <h1>🚀 Hauling Suite</h1>
      <span id="api-badge" style="display:none;font-size:10px;padding:2px 8px;border-radius:99px;font-family:var(--font-mono);color:#fff;"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button id="btn-theme" title="Tema" style="padding:4px 8px;border-radius:var(--r-sm);border:0.5px solid var(--c-border-1);background:transparent;color:var(--c-text-3);cursor:pointer;">🌗</button>
      <button id="btn-export" title="Backup" style="padding:4px 8px;border-radius:var(--r-sm);border:0.5px solid var(--c-border-1);background:transparent;color:var(--c-text-3);cursor:pointer;"><i class="ti ti-download"></i></button>
      <button onclick="resetGeminiKey()" title="Borrar API Key" style="padding:4px 8px;border-radius:var(--r-sm);border:0.5px solid var(--c-border-1);background:transparent;color:var(--c-text-3);cursor:pointer;"><i class="ti ti-key"></i></button>
    </div>
  </div>

  <div class="ship-bar">
    <div class="sg">
      <label><i class="ti ti-rocket" style="font-size:12px"></i> Ship</label>
      <div style="position:relative;flex:1;">
        <input id="ship-search-inp" type="text" autocomplete="off" spellcheck="false" placeholder="Search ship…">
        <div id="ship-dropdown" class="loc-dropdown"></div>
        <select id="ship-sel" style="display:none"></select>
      </div>
    </div>
    <div class="sg">
      <label><i class="ti ti-dashboard" style="font-size:12px"></i> Q. Drive</label>
      <select id="drive-sel" style="height:27px;"></select>
    </div>
    <div class="sg">
      <label><i class="ti ti-route" style="font-size:12px"></i> Optimizar por</label>
      <select id="opt-mode-sel" style="height:27px;">
        <option value="time">⏳ Menor Tiempo</option>
        <option value="dist">📏 Menor Distancia</option>
      </select>
    </div>
    <div class="sg" style="flex:0;min-width:70px">
      <label style="text-align:center">Hold</label>
      <div class="cap-display" onclick="const v=prompt('Capacidad SCU:', $('cap-input').value); if(v){$('cap-input').value=v;$('cap-show').textContent=v;}">
        <div class="cv" id="cap-show" style="font-size:14px;line-height:1">696</div>
      </div>
      <input type="number" id="cap-input" value="696" style="display:none">
    </div>
  </div>

  <div class="rank-bar">
    <div class="rb-top">
      <label>Faction</label> <select id="faction-sel"></select>
      <label>Rank</label> <select id="rank-sel"></select>
    </div>
  </div>

  <div class="row2">
    <div class="panel">
      <div class="ptitle">CURRENT POSITION</div>
      <div id="o-search-wrap"></div>
      <input type="hidden" id="o-loc" value="">
    </div>
    <div class="panel">
      <div class="ptitle">DELIVERY MODE</div>
      <div class="mode-seg">
        <button id="mode-full"><b>100%</b><span style="font-size:10px">max aUEC</span></button>
        <button id="mode-partial" class="on"><b>25%</b><span style="font-size:10px">XP farming</span></button>
      </div>
      <input type="range" id="pct-input" min="1" max="100" value="25" style="width:100%;margin-top:5px;accent-color:var(--c-faction);">
    </div>
  </div>

  <div class="dest-toggle">
    <input type="checkbox" id="use-dest"> <label for="use-dest">End at a fixed destination</label>
  </div>
  <div class="dest-fields hidden" id="dest-fields"><div id="d-search-wrap"></div><input type="hidden" id="d-loc" value=""></div>

  <!-- Panel Inteligente -->
  <div class="smart-panel" id="smart-panel">
    <div style="display:grid;grid-template-columns:1fr;gap:12px">
      <div>
        <label style="font-size:10px;color:var(--c-text-3);">Paste contract text</label>
        <div class="smart-input-row" style="margin-top:4px">
          <input type="text" id="smart-text-input" placeholder="Paste text and press Enter…">
          <button class="smart-btn" id="smart-parse-btn"><i class="ti ti-sparkles"></i> Parse</button>
        </div>
        <div id="smart-text-status" class="smart-status"></div>
      </div>
      <div style="border-top:1px solid var(--c-border-3);padding-top:10px">
        <label style="font-size:10px;color:var(--c-text-3);">Or Upload Screenshot (Auto-resizer active)</label>
        <label style="display:block;margin-top:6px;padding:14px;border-radius:var(--r-md);text-align:center;border:2px dashed var(--c-faction);color:var(--c-faction);cursor:pointer;font-family:var(--font-mono);font-size:12px;">
          <i class="ti ti-photo-up" style="font-size:20px;display:block;margin-bottom:4px"></i> Select screenshot file
          <input type="file" id="ocr-file-input" accept="image/*" style="display:none">
        </label>
        <div id="smart-ocr-status" class="smart-status"></div>
      </div>
    </div>
  </div>

  <div class="add-missionssion-row" style="margin-top:15px">
    <button class="accent" id="add-missionssion"><i class="ti ti-plus"></i> New Contract</button>
    <button id="clear-all"><i class="ti ti-trash"></i> Clear all</button>
  </div>

  <div class="missions-list" id="missions-list"></div>

  <div class="tabs">
    <button class="tab on" id="tab-route"><i class="ti ti-route"></i> Optimal Route</button>
  </div>

  <div id="route-tab">
    <button class="calc-btn" id="calc-btn" style="margin:10px 0;"><i class="ti ti-route"></i> Calculate Route</button>
    <div id="output" style="display:none">
      <div id="alert-box" style="margin-bottom:10px"></div>
      <div class="stats-row" id="stats"></div>
      <div class="route-vis" id="route-vis"></div>
      <div class="step-list" id="step-list"></div>
    </div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── Variables Globales ──
let SHIPS = [];
let QUANTUM_DRIVES = {};
let MATERIALS = [];
let FACTION_DATA = {};
let ALL_LOCS = {};
let STATIONS = [];

const ALL_BOX_SIZES = [1, 2, 4, 8, 16, 24, 32];
const MAX_MISSIONS = 10;
const FACTIONS = ["Covalex Shipping", "Red Wind Linehaul", "Ling Family Hauling"];

let missionSeq=0, pickSeq=0, delivSeq=0, missions=[];
let boxSize=16, boxMode='optimal', useDest=false, deliveryMode='partial', partialPct=25;
let currentRank="Trainee", oneBoxMode=false, oneBoxSize=1;
let lastRouteResult=null;
let prog={ f: FACTIONS[0], xp: { "Covalex Shipping": 0, "Red Wind Linehaul": 0, "Ling Family Hauling": 0 } };

let _activeFactionKey = "Covalex Shipping";
function factionKey(f){ return Object.keys(FACTION_DATA).find(k=>f.startsWith(k)) || "Covalex Shipping"; }
function getRanks(){ return FACTION_DATA[_activeFactionKey]?.ranks || {}; }

let CONTRACT_RANKS = {};
let RANK_ORDER = [];
let RANK_CUM = [];

// ── Carga de Datos Segura ──
async function loadGameData() {
  try {
    setBadge('sync', 'Cargando JSONs...');
    const [shipsRes, drivesRes, matsRes, factionsRes, locsRes] = await Promise.all([
      fetch('data/ships.json').catch(()=>null),
      fetch('data/drives.json').catch(()=>null),
      fetch('data/materials.json').catch(()=>null),
      fetch('data/factions.json').catch(()=>null),
      fetch('data/locations.json').catch(()=>null)
    ]);

    if(shipsRes && shipsRes.ok) { const sd = await shipsRes.json(); SHIPS = sd.ships || sd; }
    if(drivesRes && drivesRes.ok) { const dd = await drivesRes.json(); QUANTUM_DRIVES = dd.drives || dd; }
    if(matsRes && matsRes.ok) { const md = await matsRes.json(); MATERIALS = md.materials || md; }
    if(factionsRes && factionsRes.ok) { FACTION_DATA = await factionsRes.json(); }
    
    if(locsRes && locsRes.ok) {
      const rawLocs = await locsRes.json();
      const locList = rawLocs.locations || []; 
      let _i = 0;
      if (Array.isArray(locList) && locList.length > 0) {
          locList.forEach(l => {
              const loc = { id: 'loc' + (_i++), label: l.name, sys: l.system, planet: l.parent, type: l.type, pad: l.pad || 'efe', x: l.x, y: l.y, z: l.z };
              ALL_LOCS[loc.id] = loc;
              if (['station', 'lagrange', 'habitat', 'outpost'].includes(loc.type)) STATIONS.push(loc);
          });
      } else {
          Object.entries(rawLocs).forEach(([label, data]) => {
            const loc = { id: 'loc' + (_i++), label: label, name: label, ...data };
            ALL_LOCS[loc.id] = loc;
            if (['station', 'lagrange', 'habitat', 'outpost'].includes(loc.type)) STATIONS.push(loc);
          });
      }
    }
    setBadge('hidden', '');
  } catch (error) {
    console.warn("Fallo carga de JSON", error);
  }

  // Fallback si los JSONs no existían o fallaron
  if (!SHIPS.length) {

  if (Object.keys(ALL_LOCS).length === 0) {

    let i=0; Object.entries(fallbackLocs).forEach(([l, d])=>{ const loc={id:'L'+i++, label:l, ...d}; ALL_LOCS[loc.id]=loc; STATIONS.push(loc); });
  }
}

function dist3(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2);}
function sysOf(n){return n.sys||'';}
function locById(id){return ALL_LOCS[id];}
function findLoc(sub){
  const found = Object.values(ALL_LOCS).find(l => l.label.includes(sub));
  return found ? found.id : null;
}
function fmtDist(gm) {
  if (gm == null || isNaN(gm)) return '?';
  if (gm <= 0) return '0 m';
  if (gm >= 1) return parseFloat(gm.toFixed(2)) + ' Gm'; 
  const mm = gm * 1000;
  if (mm >= 1) return parseFloat(mm.toFixed(2)) + ' Mm';
  const km = gm * 1000000;
  if (km >= 1) return Math.round(km).toLocaleString('es-CL') + ' km';
  return Math.round(gm * 1000000000) + ' m';
}

// ── Search & UI Helpers ──
function searchLocs(q){
  if(!q||q.length<1)return[];
  const nq=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const results=[];
  Object.values(ALL_LOCS).forEach(l=>{
    const nl = l.label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const idx = nl.indexOf(nq);
    if(idx>=0) results.push({...l, _matchIdx:idx, _exact:nl===nq});
  });
  results.sort((a,b)=>{
    if(a._exact!==b._exact) return a._exact?-1:1;
    return a._matchIdx - b._matchIdx;
  });
  return results.slice(0,12);
}

function createLocSearch(initId, onSel){
  const w = document.createElement('div'); w.className = 'loc-wrap';
  const l = locById(initId);
  w.innerHTML = `
    <input type="text" class="loc-input ${l?'resolved':''}" value="${l?l.label:''}" placeholder="Buscar ubicación...">
    <div class="loc-dropdown"></div>`;
  const inp = w.querySelector('input');
  const drop = w.querySelector('.loc-dropdown');
  
  inp.addEventListener('input', () => {
    const q = inp.value.trim();
    if(!q) { drop.classList.remove('open'); return; }
    const res = searchLocs(q);
    if(!res.length) { drop.classList.remove('open'); return; }
    drop.innerHTML = res.map((r,i) => `<div class="loc-opt" data-i="${i}" data-id="${r.id}">${r.label}</div>`).join('');
    drop.classList.add('open');
    drop.querySelectorAll('.loc-opt').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        inp.value = opt.textContent;
        inp.className = 'loc-input resolved';
        drop.classList.remove('open');
        onSel(opt.getAttribute('data-id'));
      });
    });
  });
  inp.addEventListener('blur', () => setTimeout(()=>drop.classList.remove('open'), 200));
  return w;
}

// ── El Worker Matemático ──
const workerCode=`
  function dist3(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2);}
  function timeCost(a,b,qSpeed){
    const d=dist3(a,b); const qtTime=d/qSpeed;
    let p=150; if(b.pad==='int')p=240; else if(b.pad==='efe')p=90;
    return qtTime+p;
  }
  function distCost(a,b){ return dist3(a,b) + (b.pad==='int'?0.05:0); }
  function getCost(a,b,qSpeed,opt){ return opt==='time' ? timeCost(a,b,qSpeed) : distCost(a,b); }
  
  function vs(seq,cap){
    const g={};let l=0;
    for(const n of seq){
      if(n.role==='pickup'){g[n.mid]=(g[n.mid]||0)+n.scu; l+=n.scu; if(l>cap+1e-6)return false;}
      else if(n.role==='dropoff'){if((g[n.mid]||0)+1e-6<n.scu)return false; g[n.mid]-=n.scu; l-=n.scu;}
    }
    return true;
  }
  function nn(o,dest,nodes,cap,qSpeed,opt){
    const rem=new Set(nodes); const route=[o]; const hold={}; let load=0;
    while(rem.size>0){
      const cur=route[route.length-1]; let best=null, bc=Infinity;
      for(const n of rem){
        if(n.role==='pickup'&&load+n.scu>cap+1e-6)continue;
        if(n.role==='dropoff'&&(hold[n.mid]||0)<n.scu-1e-6)continue;
        let cost=getCost(cur,n,qSpeed,opt);
        if(n.role==='dropoff'&&(hold[n.mid]||0)>=n.scu-1e-6) cost*=0.85;
        if(cost<bc){bc=cost;best=n;}
      }
      if(!best){
         for(const n of rem){
           if(n.role!=='pickup')continue; 
           const d=getCost(cur,n,qSpeed,opt); 
           if(d<bc){bc=d;best=n;}
         }
         if(!best)break;
      }
      route.push(best); rem.delete(best);
      if(best.role==='pickup'){hold[best.mid]=(hold[best.mid]||0)+best.scu; load+=best.scu;}
      else{hold[best.mid]=(hold[best.mid]||0)-best.scu; load-=best.scu;}
    }
    if(dest)route.push(dest);
    return route;
  }
  self.onmessage=function(e){
    const r = nn(e.data.o, e.data.dest, e.data.nodes, e.data.cap, e.data.qSpeed, e.data.opt);
    let dDist=0, dTime=0;
    for(let i=0;i<r.length-1;i++){ dDist+=dist3(r[i],r[i+1]); dTime+=timeCost(r[i],r[i+1],e.data.qSpeed); }
    self.postMessage({seq:r, dist:dDist, timeSeconds:dTime, feasible:vs(r,e.data.cap)});
  };
`;

let routerWorker=null;
try{ routerWorker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'application/javascript'}))); } catch(e){}

async function calculate(){
  const oLocId=$('o-loc')?.value; const o=locById(oLocId);
  const optMode=$('opt-mode-sel').value;
  const driveKey=$('drive-sel').value;
  const drive=QUANTUM_DRIVES[driveKey] || {speed:0.18, fuelConsumption:1.0};
  const cap=parseInt($('cap-input').value)||0;
  
  if(!o || !missions.length){ alert('Falta posición actual o misiones.'); return; }

  const nodes = [];
  missions.forEach((m, mi) => {
    m.pickups.forEach(p => { const loc=locById(p.locId); if(loc) nodes.push({...loc, role:'pickup', mid:mi, scu:p.scu, mnum:mi+1}); });
    m.deliveries.forEach(d => { const loc=locById(d.locId); if(loc) nodes.push({...loc, role:'dropoff', mid:mi, scu:m.pickups[0].scu, mnum:mi+1}); }); // simplificado para el render
  });

  const calcBtn=$('calc-btn'); calcBtn.innerHTML='Calculando...';
  
  if(routerWorker) {
    routerWorker.onmessage = e => {
      const res = e.data;
      calcBtn.innerHTML='<i class="ti ti-route"></i> Calculate Route';
      $('output').style.display='block';
      let html = '';
      res.seq.forEach((n, i) => {
        html += `<div class="step-card" style="padding:10px; margin-bottom:5px;">${i===0?'📍 Inicio':n.role==='pickup'?'🔼 Recoger':'🔽 Entregar'} en <b>${n.label}</b> ${n.scu?`(${n.scu} SCU)`:''}</div>`;
      });
      $('step-list').innerHTML = html;
      $('stats').innerHTML = `<div class="stat"><div class="sv">${fmtDist(res.dist)}</div><div class="sl">Distancia Total</div></div>`;
    };
    routerWorker.postMessage({ o, dest:null, nodes, cap, qSpeed: drive.speed, opt: optMode });
  }
}

// ── Image Resizer para evitar CORS/Payload errors en Gemini ──
function resizeImage(base64Str, maxWidth = 1200) {
  return new Promise((resolve) => {
    let img = new Image();
    img.src = base64Str;
    img.onload = () => {
      let canvas = document.createElement('canvas');
      let scale = maxWidth / img.width;
      if (scale >= 1) return resolve(base64Str);
      canvas.width = maxWidth;
      canvas.height = img.height * scale;
      let ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
  });
}

function setSmartStatus(mode, type, msg) {
  const el = $(mode === 'text' ? 'smart-text-status' : 'smart-ocr-status');
  if (!el) return;
  el.className = 'smart-status' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
  el.innerHTML = type === 'sync' ? `<span class="spin" style="font-size:12px">⟳</span> ${msg}` : msg;
}

function getGeminiKey() {
  let key = localStorage.getItem('sc_gemini_key');
  if (!key) {
    key = prompt("API Key de Gemini (se guarda localmente):");
    if (key) { key = key.trim(); localStorage.setItem('sc_gemini_key', key); }
  }
  return key;
}

async function runOCR(imageSource) {
  const apiKey = getGeminiKey();
  if (!apiKey) { setSmartStatus('ocr', 'err', 'Se requiere API Key de Gemini.'); return; }
  setSmartStatus('ocr', 'sync', 'Procesando imagen (reduciendo tamaño)...');
  
  try {
    const resizedImage = await resizeImage(imageSource);
    const base64Data = resizedImage.split(',')[1];
    
    setSmartStatus('ocr', 'sync', 'Analizando con IA...');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Extrae SCU, Material, Pickups y Deliveries de este contrato de Star Citizen en JSON: {"scu":10, "material":"Gold", "pickups":["Loc 1"], "deliveries":["Loc 2"]}' }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }],
        generationConfig: { temperature: 0.1, response_mime_type: "application/json" }
      })
    });

    if (!res.ok) throw new Error('API Error ' + res.status + '. Revisa tu Key o AdBlock.');
    const data = await res.json();
    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    const parsed = JSON.parse(rawText.trim());
    
    const pId = findLoc(parsed.pickups?.[0]||'') || Object.keys(ALL_LOCS)[0];
    const dId = findLoc(parsed.deliveries?.[0]||'') || Object.keys(ALL_LOCS)[1];
    
    missions.push({
      id: ++missionSeq,
      pickups: [{id: ++pickSeq, locId: pId, scu: parsed.scu||1}],
      deliveries: [{id: ++delivSeq, locId: dId}]
    });
    renderMissions();
    setSmartStatus('ocr', 'ok', `✓ Éxito: ${parsed.scu||'?'} SCU de ${parsed.material||'Unknown'}`);
  } catch (e) {
    setSmartStatus('ocr', 'err', 'Fallo de red/API. Si usas Brave, baja los escudos. Detalle: ' + e.message);
  }
}
